  <polyline points="3,21 6.5,14 10,21"/>
  <polygon points="14,14 21,14 21,21 14,21"/>
  <rect x="1.7" y="8.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="8.7" y="1.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="16.2" y="5.2" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="1.7" y="19.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="5.2" y="12.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="8.7" y="19.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="12.7" y="12.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="19.7" y="12.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="19.7" y="19.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
  <rect x="12.7" y="19.7" width="2.6" height="2.6" fill="#ffffff" stroke="none"/>
</svg>
