<?xml version="1.0" encoding="UTF-8"?>
<!-- ymcad リボンのアイコン（SELECTALL）。作法は同じフォルダの README.md を参照。
     白一色で描き、表示側で文字色・選択色に着色する。
     線分・円・折れ線・四角形の 4 つが全部グリップ（塗った小さな四角）つき = 全部が選ばれている。
     GROUP の破線の枠とは違う形にする。 -->
