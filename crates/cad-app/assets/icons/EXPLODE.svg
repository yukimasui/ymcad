<?xml version="1.0" encoding="UTF-8"?>
<!-- ymcad リボンのアイコン（EXPLODE）。作法は同じフォルダの README.md を参照。
     白一色で描き、表示側で文字色・選択色に着色する。
     折れ線の角が弾けて 2 本の線分に分かれた絵（PR #32 の操作再レビューの案）。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 下の片（水平）と頂点 -->
  <path d="M2 21.5 L9 21.5"/>
  <rect x="0.8" y="20.3" width="2.4" height="2.4" fill="#ffffff" stroke="none"/>
  <rect x="7.8" y="20.3" width="2.4" height="2.4" fill="#ffffff" stroke="none"/>
  <!-- 右の片（垂直）と頂点 -->
  <path d="M21.5 10 L21.5 2"/>
  <rect x="20.3" y="8.8" width="2.4" height="2.4" fill="#ffffff" stroke="none"/>
  <rect x="20.3" y="0.8" width="2.4" height="2.4" fill="#ffffff" stroke="none"/>
  <!-- 角だった所（15, 15.5）の火花: 0°・45°・90°・135°・180° へ r=1.8〜5.2 -->
  <path d="M15 13.7 L15 10.3"/>
  <path d="M13.73 14.23 L11.32 11.82"/>
  <path d="M13.2 15.5 L9.8 15.5"/>
  <path d="M16.27 14.23 L18.68 11.82"/>
  <path d="M16.8 15.5 L20.2 15.5"/>
</svg>
